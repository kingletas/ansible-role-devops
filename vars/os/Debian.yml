---
# Debian-family (Debian, Ubuntu) package names and repository endpoints.
devops__keyring_dir: /etc/apt/keyrings
devops__distro_id: "{{ ansible_facts.distribution | lower }}"
devops__distro_codename: "{{ ansible_facts.distribution_release }}"

devops__base_packages:
  - acl
  - apt-transport-https
  - bash
  - bash-completion
  - bat
  - build-essential
  - ca-certificates
  - curl
  - default-mysql-client
  - direnv
  - dnsutils
  - fd-find
  - fzf
  - git
  - gnupg
  - htop
  - iputils-ping
  - jq
  - less
  - make
  - mtr-tiny
  - ncdu
  - netcat-openbsd
  - openssh-client
  - pipx
  - python3-apt
  - python3-debian
  - python3-dev
  - python3-pip
  - python3-venv
  - redis-tools
  - ripgrep
  - rsync
  - shellcheck
  - software-properties-common
  - sshuttle
  - sudo
  - tmux
  - tree
  - unzip
  - vim
  - wget
  - zip
  - zsh

devops__byobu_package: byobu
devops__docker_repo_url: "https://download.docker.com/linux/{{ devops__distro_id }}"
devops__hashicorp_repo_url: https://apt.releases.hashicorp.com
devops__k8s_repo_url: "https://pkgs.k8s.io/core:/stable:"
devops__k6_repo_url: https://dl.k6.io/deb
devops__ngrok_repo_url: https://ngrok-agent.s3.amazonaws.com
devops__gh_repo_url: https://cli.github.com/packages
devops__gcloud_repo_url: https://packages.cloud.google.com/apt
devops__grafana_repo_url: https://apt.grafana.com

devops__php_prefix: "php{{ devops_php_version }}"
devops__php_extra_packages: []

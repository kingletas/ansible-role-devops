---
# tasks file for the `devops` role
#
# Every component is gated on `devops__enabled.<component>`, which is the
# profile's component set with `devops_components` merged over it, and carries
# its own tag so a single tool can be re-run with `--tags docker`.

- name: Preflight
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Base packages
  ansible.builtin.include_tasks:
    file: base/packages.yml
    apply:
      tags: [devops, base, packages]
  when: devops__enabled.base | default(false) | bool
  tags: [devops, base, packages]

- name: User account
  ansible.builtin.include_tasks:
    file: base/user.yml
    apply:
      tags: [devops, base, user]
  when: devops__enabled.user | default(false) | bool
  tags: [devops, base, user]

- name: SSH client configuration
  ansible.builtin.include_tasks:
    file: base/ssh.yml
    apply:
      tags: [devops, base, ssh]
  when:
    - devops__enabled.ssh | default(false) | bool
    - devops_ssh_hosts | length > 0
  tags: [devops, base, ssh]

- name: Provisioned files
  ansible.builtin.include_tasks:
    file: base/files.yml
    apply:
      tags: [devops, base, files]
  when:
    - devops__enabled.files | default(false) | bool
    - devops_provision_files | length > 0
  tags: [devops, base, files]

- name: Shell environment
  ansible.builtin.include_tasks:
    file: base/shell.yml
    apply:
      tags: [devops, base, shell]
  when: devops__enabled.shell | default(false) | bool
  tags: [devops, base, shell]

- name: Shell environment fragment
  ansible.builtin.include_tasks:
    file: base/environment.yml
    apply:
      tags: [devops, base, environment]
  when: devops__enabled.base | default(false) | bool
  tags: [devops, base, environment]


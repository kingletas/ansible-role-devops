---
- name: Node.js | Register the NodeSource repository
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/repository.yml"
  vars:
    devops__repo_name: nodesource
    devops__repo_description: Node.js {{ devops_nodejs_major }}.x
    devops__repo_key_url: >-
      {{ (ansible_facts.os_family == 'Debian')
         | ternary('https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key',
                   'https://rpm.nodesource.com/gpgkey/ns-operations-public.key') }}
    devops__repo_uris: "https://deb.nodesource.com/node_{{ devops_nodejs_major }}.x"
    devops__repo_suites: nodistro
    devops__repo_components: main
    devops__repo_baseurl: "https://rpm.nodesource.com/pub_{{ devops_nodejs_major }}.x/nodistro/nodejs/$basearch"
  when: not (devops_nodejs_from_distro | bool)

- name: Node.js | Install Node.js
  ansible.builtin.package:
    name: nodejs
    state: present

- name: Node.js | Keep global npm installs out of /usr (no sudo needed)
  ansible.builtin.lineinfile:
    path: "{{ devops__home }}/.npmrc"
    regexp: '^prefix\s*='
    line: "prefix={{ devops__home }}/{{ devops_npm_prefix }}"
    create: true
    owner: "{{ devops_user }}"
    group: "{{ devops_group }}"
    mode: "0644"

- name: Node.js | Create the npm prefix directory
  ansible.builtin.file:
    path: "{{ devops__home }}/{{ devops_npm_prefix }}/lib"
    state: directory
    owner: "{{ devops_user }}"
    group: "{{ devops_group }}"
    mode: "0755"

- name: Node.js | Install the global npm packages
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: present
  become: true
  become_user: "{{ devops_user }}"
  environment:
    PATH: "{{ devops__home }}/{{ devops_npm_prefix }}/bin:{{ ansible_facts.env.PATH }}"
  loop: "{{ devops_npm_packages }}"

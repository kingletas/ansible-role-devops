---
- name: Shell | Install oh-my-zsh
  ansible.builtin.git:
    repo: "{{ devops_ohmyzsh_repo }}"
    dest: "{{ devops__home }}/.oh-my-zsh"
    depth: 1
    version: master
    update: false
  become: true
  become_user: "{{ devops_user }}"
  when: devops_ohmyzsh | bool

- name: Shell | Seed ~/.zshrc from the oh-my-zsh template
  ansible.builtin.copy:
    src: "{{ devops__home }}/.oh-my-zsh/templates/zshrc.zsh-template"
    dest: "{{ devops__home }}/.zshrc"
    remote_src: true
    force: false
    owner: "{{ devops_user }}"
    group: "{{ devops_group }}"
    mode: "0644"
  when: devops_ohmyzsh | bool

- name: Shell | Look for an existing starship
  ansible.builtin.stat:
    path: "{{ devops_bin_dir }}/starship"
  register: devops__starship_bin
  when: devops_starship | bool

- name: Shell | Install starship
  # The release URL is always `latest`, so this only installs when starship is
  # missing; remove the binary to force an upgrade.
  when:
    - devops_starship | bool
    - not devops__starship_bin.stat.exists
  block:
    - name: Shell | Create a scratch directory for the starship archive
      ansible.builtin.file:
        path: "{{ devops_tmp_dir }}/devops-starship"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Shell | Unpack starship
      ansible.builtin.unarchive:
        src: "https://github.com/starship/starship/releases/latest/download/starship-{{ devops__starship_target }}.tar.gz"
        dest: "{{ devops_tmp_dir }}/devops-starship"
        remote_src: true
        owner: root
        group: root

    - name: Shell | Move the starship binary into place
      ansible.builtin.copy:
        src: "{{ devops_tmp_dir }}/devops-starship/starship"
        dest: "{{ devops_bin_dir }}/starship"
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Shell | Clean up the starship scratch directory
      ansible.builtin.file:
        path: "{{ devops_tmp_dir }}/devops-starship"
        state: absent

- name: Shell | Enable byobu at login
  ansible.builtin.command:
    cmd: byobu-enable
    creates: "{{ devops__home }}/.byobu/.reuse-session"
  become: true
  become_user: "{{ devops_user }}"
  when: devops_byobu_enable | bool

- name: Shell | Set the login shell
  ansible.builtin.user:
    name: "{{ devops_user }}"
    shell: "{{ devops_shell_default }}"
  when: devops_shell_default | length > 0

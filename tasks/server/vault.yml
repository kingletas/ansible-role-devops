---
- name: Vault | Register the HashiCorp repository
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/repository.yml"
  vars:
    devops__repo_name: hashicorp
    devops__repo_description: HashiCorp
    devops__repo_key_url: "{{ devops__hashicorp_repo_url }}/gpg"
    devops__repo_uris: "{{ devops__hashicorp_repo_url }}"
    devops__repo_suites: "{{ devops__distro_codename }}"
    devops__repo_components: main
    devops__repo_baseurl: "{{ devops__hashicorp_repo_url }}/{{ 'fedora' if ansible_facts.distribution == 'Fedora' else 'RHEL' }}/$releasever/$basearch/stable"

- name: Vault | Install the server package
  # The vendor package brings its own `vault` user, unit file and /etc/vault.d.
  ansible.builtin.package:
    name: vault
    state: present

- name: Vault | Create the data and plugin directories
  ansible.builtin.file:
    path: "{{ devops_vault_config_dir }}/{{ item }}"
    state: directory
    owner: vault
    group: vault
    mode: "0750"
  loop:
    - data
    - plugins

- name: Vault | Write the server configuration
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ devops_vault_config_dir }}/vault.hcl"
    owner: vault
    group: vault
    mode: "0640"
  notify: Restart vault

- name: Vault | Enable the service
  ansible.builtin.service:
    name: vault
    state: "{{ devops_vault_service_state }}"
    enabled: true
  when: devops__systemd | bool

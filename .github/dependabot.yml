---
version: 2

updates:
  # Dependabot reads the `# vX.Y.Z` comment beside each pinned SHA and moves both together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # The linter and Molecule versions pinned in requirements-dev.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    groups:
      all:
        patterns: ["*"]
    open-pull-requests-limit: 2
